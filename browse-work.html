<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Work Postings & Tenders - Pragati Connect (प्रगति कनेक्ट)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <div id="navbar-container"></div>

  <main class="py-4">
    <div class="container">
      <!-- Page Header -->
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
          <h3 class="fw-bold text-primary mb-1" data-i18n="nav_browse_work">Live Construction Work Requirements</h3>
          <p class="text-secondary small mb-0">Discover and bid on high-budget subcontracting packages posted directly by tier-1 EPC companies.</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <label class="small text-secondary fw-semibold text-nowrap mb-0">Sort By:</label>
          <select class="form-select form-select-sm" id="workSortBy" style="width: 170px;">
            <option value="newest">Newest First</option>
            <option value="deadline_soon">Deadline (Soonest)</option>
          </select>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 bg-white">
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 text-primary fs-5">
            <i class="bi bi-search"></i>
          </span>
          <input type="text" class="form-control border-start-0 py-2" id="workSearchQuery" data-i18n-ph="ph_search_work" placeholder="Search by project name, EPC company (e.g. L&T, Tata), trade or location...">
          <button class="btn btn-orange px-4 fw-semibold" id="workSearchBtn" data-i18n="btn_find_work">Find Work</button>
        </div>
      </div>

      <div class="row g-4">
        <!-- Filter Sidebar (Left) -->
        <div class="col-lg-3">
          <div class="card border-0 shadow-sm rounded-4 p-4 bg-white sticky-top" style="top: 85px;">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="fw-bold text-primary mb-0"><i class="bi bi-funnel me-1"></i> Filter Work</h6>
              <button class="btn btn-link btn-sm text-secondary p-0 text-decoration-none" id="resetWorkFiltersBtn" data-i18n="btn_reset_filters">Reset</button>
            </div>

            <!-- Active Only Toggle -->
            <div class="form-check form-switch mb-3 pb-3 border-bottom">
              <input class="form-check-input" type="checkbox" id="workActiveOnlyFilter" checked>
              <label class="form-check-label small fw-semibold" for="workActiveOnlyFilter">Active Tenders Only</label>
            </div>

            <!-- Trade Filter -->
            <div class="mb-3">
              <label class="form-label small fw-semibold d-block mb-2">Trade Required</label>
              <div style="max-height: 180px; overflow-y: auto;" class="pe-1">
                <div class="form-check form-check-sm mb-1">
                  <input class="form-check-input" type="checkbox" name="workTradeFilter" value="Civil" id="wCivil">
                  <label class="form-check-label small" for="wCivil" data-i18n="trade_civil">Civil</label>
                </div>
                <div class="form-check form-check-sm mb-1">
                  <input class="form-check-input" type="checkbox" name="workTradeFilter" value="MEP" id="wMEP">
                  <label class="form-check-label small" for="wMEP" data-i18n="trade_mep">MEP & HVAC</label>
                </div>
                <div class="form-check form-check-sm mb-1">
                  <input class="form-check-input" type="checkbox" name="workTradeFilter" value="Structural Steel" id="wSteel">
                  <label class="form-check-label small" for="wSteel" data-i18n="trade_steel">Structural Steel & PEB</label>
                </div>
                <div class="form-check form-check-sm mb-1">
                  <input class="form-check-input" type="checkbox" name="workTradeFilter" value="Concrete" id="wConcrete">
                  <label class="form-check-label small" for="wConcrete" data-i18n="trade_concrete">Concrete</label>
                </div>
                <div class="form-check form-check-sm mb-1">
                  <input class="form-check-input" type="checkbox" name="workTradeFilter" value="Road/Highway" id="wRoad">
                  <label class="form-check-label small" for="wRoad" data-i18n="trade_highway">Road / Highway</label>
                </div>
                <div class="form-check form-check-sm mb-1">
                  <input class="form-check-input" type="checkbox" name="workTradeFilter" value="Waterproofing" id="wWater">
                  <label class="form-check-label small" for="wWater" data-i18n="trade_waterproofing">Waterproofing</label>
                </div>
              </div>
            </div>

            <!-- State Filter -->
            <div class="mb-3">
              <label class="form-label small fw-semibold" data-i18n="label_state">State / Location</label>
              <select class="form-select form-select-sm" id="workStateFilter">
                <option value="">All States</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Madhya Pradesh">Madhya Pradesh</option>
                <option value="Telangana">Telangana</option>
                <option value="Gujarat">Gujarat</option>
              </select>
            </div>

            <!-- Budget Range -->
            <div class="mb-3">
              <label class="form-label small fw-semibold" data-i18n="label_budget_range">Estimated Budget</label>
              <select class="form-select form-select-sm" id="workBudgetFilter">
                <option value="">Any Budget</option>
                <option value="Below ₹10 Lakh">Below ₹10 Lakh</option>
                <option value="₹10-50 Lakh">₹10-50 Lakh</option>
                <option value="₹50 Lakh - ₹1 Cr">₹50 Lakh - ₹1 Cr</option>
                <option value="₹1-5 Cr">₹1-5 Cr</option>
                <option value="₹5-10 Cr">₹5-10 Cr</option>
                <option value="₹10-50 Cr">₹10-50 Cr</option>
                <option value="Above ₹50 Cr">Above ₹50 Cr</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Results List (Right) -->
        <div class="col-lg-9">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold text-secondary mb-0" id="workResultsCount">Loading requirements...</h6>
            <span class="small text-muted"><i class="bi bi-clock-history me-1"></i> Real-time EPC requirements</span>
          </div>

          <div id="workPostingsList">
            <!-- Populated via search.js -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { renderNavbar, renderFooter } from './js/common.js';
    import { initWorkSearch } from './js/search.js';
    import { applyTranslations } from './js/i18n.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('browse-work');
      renderFooter();
      applyTranslations();
      initWorkSearch();
    });
  </script>
</body>
</html>
